name: Deploy map demo

on:
  push:
    branches: [main]
    paths: ["web/**", "fastroute/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[ml]"

      # Reuse the OpenStreetMap download between deploys so the shared
      # Overpass servers are only queried when the query itself changes.
      - name: Restore OpenStreetMap download
        id: osm
        uses: actions/cache@v4
        with:
          path: data/raw
          key: osm-central-london-${{ hashFiles('fastroute/overpass.py') }}
      - name: Download central London
        if: steps.osm.outputs.cache-hit != 'true'
        run: python -m fastroute fetch

      - name: Build routing graph
        run: python -m fastroute build
      - name: Export graph, hierarchies and learned ETA model for the browser
        run: python -m fastroute export-web --out web/data --eta-trips 20000

      # A plain copy of the built site, so it can be previewed privately
      # before the repository is public and Pages is switched on.
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: |
            web
            !web/test
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    # Pages needs the repository to be public on this plan; until then, the
    # build above still produces the site-preview download.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
