name: Deploy map demo

on:
  push:
    branches: [main]
    paths: ["web/**", "ridegraph/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write # to push the private site-preview branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[ml,docs]"

      # Reuse the OpenStreetMap downloads between deploys so the shared
      # Overpass servers are only queried when a query or a city changes.
      - name: Restore OpenStreetMap downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: osm-cities-${{ hashFiles('ridegraph/overpass.py', 'ridegraph/cities.py') }}
          restore-keys: osm-
      - name: Download each city that is missing
        run: |
          for city in london nicosia new-york; do
            raw=$(python -c "from ridegraph.cities import get; print(get('$city').raw_path)")
            [ -f "$raw" ] || python -m ridegraph fetch --city "$city"
          done

      - name: Build the routing graphs
        run: for city in london nicosia new-york; do python -m ridegraph build --city "$city"; done
      # The page asks TfL for live disruptions itself; this snapshot is the
      # fallback when the feed can't be reached from the viewer's browser.
      - name: Snapshot live road disruptions from TfL
        run: python -m ridegraph live --out data/tfl.json || echo "TfL feed unavailable; no snapshot"
      - name: Export each city for the browser
        run: |
          python -m ridegraph export-web --city london --tfl data/tfl.json
          python -m ridegraph export-web --city nicosia
          python -m ridegraph export-web --city new-york

      - name: Build the documentation into the site
        run: mkdocs build --strict -d web/docs

      # The built site, data included, on its own branch, so it can be
      # previewed privately before the repository is public and Pages is on.
      - name: Save the built site to the site-preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/site && cp -r web /tmp/site && rm -rf /tmp/site/test
          cd /tmp/site
          git init -q -b site-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Site preview built from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:site-preview
      # Cloudflare Pages hosts the public site while the repository is
      # private. Runs once the two repository secrets are set.
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          preCommands: |
            rm -rf /tmp/site/.git
            wrangler pages project create ridegraph --production-branch=main || true
          command: pages deploy /tmp/site --project-name=ridegraph --branch=main --commit-dirty=true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    # Pages needs the repository to be public on this plan; until then, the
    # build above still produces the site-preview download.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
