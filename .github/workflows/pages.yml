name: Deploy map demo

on:
  push:
    branches: [main]
    paths: ["web/**", "fastroute/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write # to push the private site-preview branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[ml]"

      # Reuse the OpenStreetMap download between deploys so the shared
      # Overpass servers are only queried when the query itself changes.
      - name: Restore OpenStreetMap download
        id: osm
        uses: actions/cache@v4
        with:
          path: data/raw
          key: osm-central-london-${{ hashFiles('fastroute/overpass.py') }}
      - name: Download central London
        if: steps.osm.outputs.cache-hit != 'true'
        run: python -m fastroute fetch

      - name: Build routing graph
        run: python -m fastroute build
      - name: Export graph, hierarchies and learned ETA model for the browser
        run: python -m fastroute export-web --out web/data --eta-trips 20000

      # The built site, data included, on its own branch, so it can be
      # previewed privately before the repository is public and Pages is on.
      - name: Save the built site to the site-preview branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/site && cp -r web /tmp/site && rm -rf /tmp/site/test
          cd /tmp/site
          git init -q -b site-preview
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Site preview built from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:site-preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    # Pages needs the repository to be public on this plan; until then, the
    # build above still produces the site-preview download.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
