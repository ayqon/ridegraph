name: Deploy site

on:
  push:
    branches: [main]
    paths: ["web/**", "ridegraph/**", "docs/**", "mkdocs.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[ml,docs]"

      # The exported cities (graphs, hierarchies, trained models, dispatch
      # replays) only change when the Python code does, so reuse them and
      # skip the half hour of preprocessing and training when it hasn't.
      - name: Restore exported city data
        id: citydata
        uses: actions/cache@v4
        with:
          path: web/data
          key: webdata-${{ hashFiles('ridegraph/**/*.py', 'pyproject.toml', '.github/workflows/pages.yml') }}

      # Reuse the OpenStreetMap downloads between deploys so the shared
      # Overpass servers are only queried when a query or a city changes.
      - name: Restore OpenStreetMap downloads
        if: steps.citydata.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: data/raw
          key: osm-cities-${{ hashFiles('ridegraph/overpass.py', 'ridegraph/cities.py') }}
      - name: Download each city that is missing
        if: steps.citydata.outputs.cache-hit != 'true'
        run: |
          for city in london nicosia new-york; do
            raw=$(python -c "from ridegraph.cities import get; print(get('$city').raw_path)")
            [ -f "$raw" ] || python -m ridegraph fetch --city "$city"
          done

      - name: Build the routing graphs
        if: steps.citydata.outputs.cache-hit != 'true'
        run: for city in london nicosia new-york; do python -m ridegraph build --city "$city"; done
      # The page asks TfL for live disruptions itself; this snapshot is the
      # fallback when the feed can't be reached from the viewer's browser.
      - name: Snapshot live road disruptions from TfL
        if: steps.citydata.outputs.cache-hit != 'true'
        run: python -m ridegraph live --out data/tfl.json || echo "TfL feed unavailable; no snapshot"
      - name: Export each city for the browser
        if: steps.citydata.outputs.cache-hit != 'true'
        run: |
          python -m ridegraph export-web --city london --tfl data/tfl.json
          python -m ridegraph export-web --city nicosia
          python -m ridegraph export-web --city new-york

      - name: Build the documentation into the site
        run: mkdocs build --strict -d web/docs

      # The built site, data included, on its own branch, so it can be
      # previewed privately before the repository is public and Pages is on.
      - name: Assemble the site
        run: rm -rf /tmp/site && cp -r web /tmp/site && rm -rf /tmp/site/test
      # Cloudflare Pages hosts the site at ridegraph.dev.
      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy /tmp/site --project-name=ridegraph --branch=main --commit-dirty=true
