site_name: Ridegraph
site_description: Routing, arrival-time prediction and ride dispatch on real city road networks, written from scratch.
site_url: https://ridegraph.dev/docs/
repo_url: https://github.com/ayqon/ridegraph
repo_name: ayqon/ridegraph
edit_uri: edit/main/docs/
copyright: Code MIT. Road data © OpenStreetMap contributors. Disruptions powered by TfL Open Data.

theme:
  name: material
  palette:
    - scheme: default
      primary: black
      accent: grey
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: black
      accent: grey
      toggle:
        icon: material/brightness-4
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight

nav:
  - Overview: index.md
  - How it works: how-it-works.md
  - Architecture: architecture.md
  - Design decisions: decisions.md
  - Road rules: road-rules.md
  - Results: writeup.md
  - HTTP API: http-api.md
  - Command line: cli.md
  - Python API: api.md
  - Live map: https://ridegraph.dev/

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false
            docstring_style: google
            members_order: source
            show_root_heading: true
            heading_level: 2
            filters: ["!^_"]

hooks:
  - scripts/docs_hooks.py
