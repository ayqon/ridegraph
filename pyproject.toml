[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastroute"
version = "0.1.0"
description = "Quickest-route search on real road networks: Dijkstra, A* and Contraction Hierarchies from first principles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ioannis Konstantinou" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "networkx>=3", "ruff>=0.5"]

[project.scripts]
fastroute = "fastroute.__main__:main"

[tool.setuptools.packages.find]
include = ["fastroute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
