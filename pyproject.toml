[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastroute"
version = "1.0.0"
description = "Quickest routes, live closures, learned ETAs and ride dispatch on real road networks, built from first principles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ioannis Konstantinou" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "networkx>=3",
  "ruff>=0.5",
  "mypy==2.3.1",
  "scikit-learn>=1.3",
  "fastapi>=0.110",
  "httpx>=0.27",
]

api = ["fastapi>=0.110", "uvicorn>=0.29"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.25"]

[project.scripts]
fastroute = "fastroute.__main__:main"

[tool.setuptools.packages.find]
include = ["fastroute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["fastroute"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query"]
